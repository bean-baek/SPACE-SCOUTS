name = "space-scouts"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

# Community board storage.
#
# The binding MUST be named DB — functions/api/messages.js reads env.DB. (wrangler's
# own `d1 create` output suggests a binding named after the database; using that would
# leave env.DB undefined and every board request would 500.)
#
# A database_id is not a secret — it identifies the resource, and reaching it still
# requires account credentials — so it is committed here on purpose.
#
# This file is read by `npx wrangler pages deploy dist` and by `wrangler d1 execute`.
# Deploys made through the Pages dashboard's Git integration do NOT read it; those
# need the same binding set under Settings -> Functions -> D1 bindings, or the
# Function ships with no database and the board fails to load.
[[d1_databases]]
binding = "DB"
database_name = "space-scouts-board"
database_id = "d5579b6b-c10b-44a1-ae2e-bd2d4135a3ca"
